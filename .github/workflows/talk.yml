name: talk

on:
  push:
    branches: [main]
    paths: [talk/**, .github/workflows/talk.yml]
  pull_request:
    paths: [talk/**, .github/workflows/talk.yml]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pdfs:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make -C talk
      - uses: actions/upload-artifact@v7
        with:
          name: talk
          path: |
            talk/build/slides.pdf
            talk/build/notes.pdf

  attach:
    if: github.event_name == 'release'
    needs: pdfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: talk
          path: pdfs
      - run: gh release upload "$TAG" pdfs/slides.pdf pdfs/notes.pdf --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
